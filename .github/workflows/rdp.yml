name: Beru-XFCE-RDP

on:
  workflow_dispatch:
    inputs:
      ts_key:
        description: 'Tailscale Auth Key'
        required: true
      username:
        description: 'Linux Username'
        required: true
        default: 'beru'
      password:
        description: 'Linux Password'
        required: true
        default: 'Beru2026'

jobs:
  xfce-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fast Setup XFCE & XRDP
        env:
          U_NAME: ${{ github.event.inputs.username }}
          U_PASS: ${{ github.event.inputs.password }}
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xrdp aria2 curl wget git

          sudo useradd -m -s /bin/bash --force-badname "$U_NAME" || true
          echo "$U_NAME:$U_PASS" | sudo chpasswd
          sudo usermod -aG sudo,adm,ssl-cert "$U_NAME"
          echo "$U_NAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/beru_user

          echo "xfce4-session" | sudo -u "$U_NAME" tee /home/"$U_NAME"/.xsession
          sudo sed -i 's|^test -x /etc/X11/Xsession && exec /etc/X11/Xsession|exec startxfce4|g' /etc/xrdp/startwm.sh

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Connect Tailscale
        env:
          TS_AUTH: ${{ github.event.inputs.ts_key }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTH" --hostname="beru-xfce" --accept-routes

      - name: Show RDP Details
        env:
          U_NAME: ${{ github.event.inputs.username }}
          U_PASS: ${{ github.event.inputs.password }}
        run: |
          IP=$(tailscale ip -4)
          RAM=$(free -h | awk '/^Mem:/ {print $2}')
          echo "========================================="
          echo "RDP IP       : $IP"
          echo "USERNAME     : $U_NAME"
          echo "PASSWORD     : $U_PASS"
          echo "RAM          : $RAM"
          echo "========================================="

      - name: Keep Alive (6 Hours)
        run: |
          sleep 21000
