name: Beru-Windows-RDP

on:
  workflow_dispatch:
    inputs:
      ts_key:
        description: 'Tailscale Auth Key'
        required: true
      username:
        description: 'Windows Username'
        required: true
        default: 'BeruCrypt002'
      password:
        description: 'Windows Password'
        required: true
        default: 'Beru12112k'
      auto_restart:
        description: 'Start a new runner before the 6h limit'
        required: true
        type: boolean
        default: true
      install_tools:
        description: 'Install rclone + aria2 for fast uploads'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows-rdp:
    name: Windows RDP via Tailscale
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Boost System, RDP 60FPS and Network
        env:
          U_NAME: ${{ inputs.username }}
          U_PASS: ${{ inputs.password }}
          INSTALL_TOOLS: ${{ inputs.install_tools }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $ProgressPreference = 'SilentlyContinue'
          "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($env:INSTALL_TOOLS -eq 'true') {
            Start-Process choco -ArgumentList "install -y --no-progress --limit-output rclone aria2" -WindowStyle Hidden
          }

          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg).Replace("PasswordComplexity = 1", "PasswordComplexity = 0") | Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item C:\secpol.cfg -Force

          $sec = ConvertTo-SecureString $env:U_PASS -AsPlainText -Force
          if (Get-LocalUser -Name $env:U_NAME) {
            Set-LocalUser -Name $env:U_NAME -Password $sec
          } else {
            New-LocalUser -Name $env:U_NAME -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $env:U_NAME
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:U_NAME

          Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -SubmitSamplesConsent 2 -MAPSReporting 0
          Add-MpPreference -ExclusionPath "C:\", "D:\"

          fsutil behavior set disablelastaccess 1 | Out-Null
          fsutil behavior set disable8dot3 1 | Out-Null

          powercfg /setactive SCHEME_MIN
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0

          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v NetworkThrottlingIndex /t REG_DWORD /d 0xffffffff /f | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" /v SystemResponsiveness /t REG_DWORD /d 0 /f | Out-Null

          netsh int tcp set global autotuninglevel=normal | Out-Null
          netsh int tcp set global rss=enabled | Out-Null

          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f | Out-Null
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f | Out-Null
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations" /v DWMFRAMEINTERVAL /t REG_DWORD /d 15 /f | Out-Null

          $tsPol = "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          reg add $tsPol /v ColorDepth /t REG_DWORD /d 4 /f | Out-Null
          reg add $tsPol /v fNoRemoteDesktopWallpaper /t REG_DWORD /d 1 /f | Out-Null
          reg add $tsPol /v SelectTransport /t REG_DWORD /d 0 /f | Out-Null
          reg add $tsPol /v bEnumerateHWBeforeSW /t REG_DWORD /d 1 /f | Out-Null
          reg add $tsPol /v AVC444ModePreferred /t REG_DWORD /d 1 /f | Out-Null
          reg add $tsPol /v AVCHardwareEncodePreferred /t REG_DWORD /d 1 /f | Out-Null
          reg add $tsPol /v MaxCompressionLevel /t REG_DWORD /d 1 /f | Out-Null
          reg add $tsPol /v fDisableFontSmoothing /t REG_DWORD /d 0 /f | Out-Null

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          $svcs = 'WSearch','SysMain','wuauserv','DiagTrack','Spooler','WerSvc','UsoSvc','MapsBroker','PcaSvc'
          foreach ($svc in $svcs) {
            Stop-Service -Name $svc -Force
            Set-Service -Name $svc -StartupType Disabled
          }

          $procs = 'ngen','ngentask','mscorsvw','CompatTelRunner','TiWorker','TrustedInstaller'
          foreach ($p in $procs) {
            Stop-Process -Name $p -Force
          }

          reg add "HKLM\SOFTWARE\Microsoft\ServerManager" /v DoNotOpenServerManagerAtLogon /t REG_DWORD /d 1 /f | Out-Null
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager" /v DoNotOpenAtLogon /t REG_DWORD /d 1 /f | Out-Null

          reg load HKU\DefUser C:\Users\Default\NTUSER.DAT | Out-Null
          reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop" /v MenuShowDelay /t REG_SZ /d 0 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f | Out-Null
          reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" /v EnableTransparency /t REG_DWORD /d 0 /f | Out-Null
          [gc]::Collect()
          Start-Sleep -Seconds 1
          reg unload HKU\DefUser | Out-Null

          $global:LASTEXITCODE = 0

      - name: Connect Tailscale
        env:
          TS_AUTH: ${{ inputs.ts_key }}
          TS_HOST: beru-win-${{ github.run_number }}
        run: |
          Write-Host "::add-mask::$env:TS_AUTH"
          $msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"
          curl.exe -sL "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -o $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue

          & $ts up --authkey="$env:TS_AUTH" --hostname="$env:TS_HOST" --accept-routes --accept-dns=false --unattended --reset
          if ($LASTEXITCODE -ne 0) { throw "Tailscale connection failed" }

          $ip = $null
          for ($i = 0; $i -lt 30 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 1 }
          }
          if (-not $ip) { throw "No Tailscale IP assigned" }

          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Print RDP Details
        env:
          U_NAME: ${{ inputs.username }}
          U_PASS: ${{ inputs.password }}
        run: |
          $ram   = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $cpu   = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          $cores = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $disk  = [math]::Round((Get-PSDrive C).Free / 1GB, 1)

          $summary = @(
            "**Windows RDP Ready (60FPS Boosted)**"
            ""
            "| Property | Value |"
            "| :--- | :--- |"
            "| **IP** | ``$env:TS_IP`` |"
            "| **Username** | ``$env:U_NAME`` |"
            "| **Password** | ``$env:U_PASS`` |"
            "| **CPU** | $cpu ($cores Threads) |"
            "| **RAM** | $ram GB |"
            "| **Free Disk** | $disk GB |"
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "=========================================="
          Write-Host "  IP        : $env:TS_IP"
          Write-Host "  Username  : $env:U_NAME"
          Write-Host "  Password  : $env:U_PASS"
          Write-Host "  RAM       : $ram GB"
          Write-Host "  CPU       : $cpu ($cores threads)"
          Write-Host "  Free disk : $disk GB (C:)"
          Write-Host "=========================================="

      - name: Keep Alive and Auto-Restart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_RESTART: ${{ inputs.auto_restart }}
          IN_TS_KEY: ${{ inputs.ts_key }}
          IN_USER: ${{ inputs.username }}
          IN_PASS: ${{ inputs.password }}
          IN_TOOLS: ${{ inputs.install_tools }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $start     = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START)
          $restartAt = $start.AddMinutes(335)
          $endAt     = $start.AddMinutes(355)
          $restarted = $false

          while ([DateTimeOffset]::UtcNow -lt $endAt) {
            if (Test-Path "C:\stop.txt") { break }

            $procs = 'ngen','ngentask','mscorsvw','CompatTelRunner','TiWorker'
            foreach ($p in $procs) {
              Stop-Process -Name $p -Force -ErrorAction SilentlyContinue
            }

            if ($env:AUTO_RESTART -eq 'true' -and -not $restarted -and [DateTimeOffset]::UtcNow -ge $restartAt) {
              gh workflow run "$env:WORKFLOW_NAME" --ref "$env:REF_NAME" `
                -f ts_key="$env:IN_TS_KEY" `
                -f username="$env:IN_USER" `
                -f password="$env:IN_PASS" `
                -f auto_restart="$env:AUTO_RESTART" `
                -f install_tools="$env:IN_TOOLS"
              $restarted = $true
            }

            $left = [int]($endAt - [DateTimeOffset]::UtcNow).TotalMinutes
            Write-Host "Remaining: $left min | IP: $env:TS_IP"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup Tailscale
        if: always()
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (Test-Path $ts) {
            & $ts logout 2>$null
          }
          $global:LASTEXITCODE = 0
