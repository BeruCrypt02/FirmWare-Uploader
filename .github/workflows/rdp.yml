name: Beru-RDP

on:
  workflow_dispatch:
    inputs:
      ts_key:
        description: 'Tailscale Auth Key'
        required: true
      username:
        description: 'RDP Username'
        required: true
        default: 'BeruCrypt02'
      password:
        description: 'RDP Password'
        required: true
        default: 'Beru@2026!Pass'

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: System Optimization and User Setup
        shell: pwsh
        run: |
          $u = "${{ github.event.inputs.username }}"
          $p = "${{ github.event.inputs.password }}"
          secedit /export /cfg c:\secpol.cfg
          (Get-Content c:\secpol.cfg).Replace("PasswordComplexity = 1", "PasswordComplexity = 0") | Set-Content c:\secpol.cfg
          secedit /configure /db c:\windows\security\local.sdb /cfg c:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item c:\secpol.cfg -Force
          net user runneradmin $p /Y
          net user $u $p /add /Y
          net user $u /active:yes
          Set-LocalUser -Name $u -PasswordNeverExpires $true
          net localgroup Administrators $u /add
          net localgroup "Remote Desktop Users" $u /add
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          reg add "HKLM\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}" /v IsInstalled /t REG_DWORD /d 0 /f
          reg add "HKLM\SOFTWARE\Microsoft\ServerManager" /v DoNotOpenServerManagerAtLogon /t REG_DWORD /d 1 /f
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

      - name: Connect Tailscale Network
        shell: pwsh
        run: |
          choco install tailscale -y --no-progress
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ github.event.inputs.ts_key }}" --hostname="beru-node" --unattended
          Start-Sleep -Seconds 5

      - name: Display Connection Details
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          $u = "${{ github.event.inputs.username }}"
          $p = "${{ github.event.inputs.password }}"
          Write-Host "========================================="
          Write-Host "RDP IP       : $ip"
          Write-Host "USERNAME     : .\$u"
          Write-Host "BACKUP USER  : .\runneradmin"
          Write-Host "PASSWORD     : $p"
          Write-Host "========================================="
          "RDP IP: **$ip**`nUsername: **.\$u**`nBackup User: **.\runneradmin**`nPassword: **$p**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Hold Session
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }
