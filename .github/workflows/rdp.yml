      - name: Optimize for RDP performance
        continue-on-error: true
        run: |
          # High performance power plan
          powercfg /setactive SCHEME_MIN

          # RDP policies: 16-bit color, no wallpaper, allow UDP + TCP
          $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $ts -Force | Out-Null
          Set-ItemProperty -Path $ts -Name 'ColorDepth' -Value 3 -Type DWord
          Set-ItemProperty -Path $ts -Name 'fNoRemoteDesktopWallpaper' -Value 1 -Type DWord
          Set-ItemProperty -Path $ts -Name 'SelectTransport' -Value 0 -Type DWord

          # Stop heavy background services
          foreach ($svc in 'WSearch','SysMain','wuauserv','DiagTrack') {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Do not open Server Manager at logon
          $sm = 'HKLM:\SOFTWARE\Microsoft\ServerManager'
          New-Item -Path $sm -Force | Out-Null
          Set-ItemProperty -Path $sm -Name 'DoNotOpenServerManagerAtLogon' -Value 1 -Type DWord

          # Best-performance visual effects for every NEW profile (default user hive)
          reg load HKU\DefUser C:\Users\Default\NTUSER.DAT | Out-Null
          reg add "HKU\DefUser\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop" /v MenuShowDelay /t REG_SZ /d 0 /f | Out-Null
          reg add "HKU\DefUser\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f | Out-Null
          [gc]::Collect()
          Start-Sleep -Seconds 2
          reg unload HKU\DefUser | Out-Null

          Write-Host "RDP performance tweaks applied."
